version: '3.8'

services:
# Frontend
# Backend
# Database

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
    - "80:80"
    restart: always

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      - database
    restart: always

  database:
    image: postgres:15-alpine
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data  # keeps your data safe even if the container is deleted
    restart: always

volumes:
  db_data:
  backend_uploads:
